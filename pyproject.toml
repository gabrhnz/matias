[project]
name = "matilab"
version = "0.1.0"
description = "MatiLab: práctica de matemáticas para 3.º a 6.º grado."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117.1",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
